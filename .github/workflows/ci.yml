name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # dist/ is gitignored. typecheck does not emit, and npm test exits 0
      # when the glob matches nothing, so compile before test and smoke.
      - run: npm run build
      - run: npm test
      - run: npm run smoke
