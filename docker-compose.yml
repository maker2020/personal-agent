x-hearth-build: &hearth-build
  context: .
  args:
    NPM_REGISTRY: ${NPM_REGISTRY:-}
    APT_MIRROR: ${HEARTH_APT_MIRROR:-}
    DOCKER_CLI_BASE: ${DOCKER_CLI_BASE:-https://download.docker.com/linux/static/stable}
    HEARTH_IMAGE_PREFIX: ${HEARTH_IMAGE_PREFIX:-}

services:
  postgres:
    image: ${HEARTH_IMAGE_PREFIX:-}library/postgres:16-alpine
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hearth
    volumes:
      - hearth-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sandbox:
    build: *hearth-build
    command: ["node", "dist/packages/sandbox/src/main.js"]
    env_file: .env
    environment:
      HEARTH_ENV: production
      HEARTH_SANDBOX: docker
      HEARTH_SANDBOX_PORT: 8790
      # Same absolute path inside this container and on the host. The Docker
      # socket resolves bind sources on the host, so a named volume here would
      # hide sandbox_write from sandbox_exec.
      HEARTH_WORKSPACE_ROOT: ${HEARTH_WORKSPACE_ROOT:-/var/lib/hearth/workspaces}
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HEARTH_WORKSPACE_ROOT:-/var/lib/hearth/workspaces}:${HEARTH_WORKSPACE_ROOT:-/var/lib/hearth/workspaces}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8790/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  vosk:
    build:
      context: .
      dockerfile: Dockerfile.speech
      args:
        APT_MIRROR: ${HEARTH_APT_MIRROR:-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        HEARTH_IMAGE_PREFIX: ${HEARTH_IMAGE_PREFIX:-}
    environment:
      VOSK_MODEL: /models/vosk-model-small-cn-0.22
      SPEECH_PORT: 2700
      EDGE_VOICE: ${HEARTH_TTS_VOICE:-zh-CN-XiaoxiaoNeural}
    volumes:
      - ${HEARTH_VOSK_MODEL_DIR:-/var/lib/hearth/vosk}:/models:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2700/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  gateway:
    build: *hearth-build
    command: ["node", "dist/packages/gateway/src/main.js"]
    env_file: .env
    environment:
      HEARTH_ENV: production
      HEARTH_ROLES: gateway,agent,telephony
      HEARTH_SENTINEL_EXTERNAL: "1"
      HEARTH_SANDBOX: docker
      HEARTH_SANDBOX_URL: http://sandbox:8790
      HEARTH_GATEWAY_HOST: 0.0.0.0
      HEARTH_GATEWAY_PORT: 8787
      HEARTH_STUN_URL: ${HEARTH_STUN_URL:-}
      HEARTH_ICE_SERVERS: ${HEARTH_ICE_SERVERS:-}
      HEARTH_TURN_URL: ${HEARTH_TURN_URL:-}
      HEARTH_TURN_USERNAME: ${HEARTH_TURN_USERNAME:-}
      HEARTH_TURN_PASSWORD: ${HEARTH_TURN_PASSWORD:-}
      HEARTH_ICE_PUBLIC_IP: ${HEARTH_ICE_PUBLIC_IP:-}
      HEARTH_RTC_PORT_MIN: ${HEARTH_RTC_PORT_MIN:-50000}
      HEARTH_RTC_PORT_MAX: ${HEARTH_RTC_PORT_MAX:-50049}
      HEARTH_TURN_TLS: ${HEARTH_TURN_TLS:-0}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      HEARTH_ASR_PROVIDER: ${HEARTH_ASR_PROVIDER:-vosk}
      HEARTH_VOSK_URL: ${HEARTH_VOSK_URL:-ws://vosk:2700}
      HEARTH_TTS_PROVIDER: ${HEARTH_TTS_PROVIDER:-edge}
      HEARTH_TTS_URL: ${HEARTH_TTS_URL:-http://vosk:2700/tts}
      HEARTH_TTS_VOICE: ${HEARTH_TTS_VOICE:-zh-CN-XiaoxiaoNeural}
      HEARTH_TTS_RATE: ${HEARTH_TTS_RATE:-}
      HEARTH_TTS_PITCH: ${HEARTH_TTS_PITCH:-}
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
      DSH_HOME: /data/dsh
    volumes:
      - hearth-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      sandbox:
        condition: service_healthy
      vosk:
        condition: service_healthy
    ports:
      - "${HEARTH_HTTP_BIND:-127.0.0.1}:${HEARTH_HTTP_PORT:-8787}:8787"
      - "${HEARTH_RTC_PORT_MIN:-50000}-${HEARTH_RTC_PORT_MAX:-50049}:${HEARTH_RTC_PORT_MIN:-50000}-${HEARTH_RTC_PORT_MAX:-50049}/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  sentinel:
    build: *hearth-build
    command: ["node", "dist/packages/sentinel/src/main.js"]
    env_file: .env
    environment:
      HEARTH_ENV: production
      HEARTH_ROLES: sentinel
      HEARTH_SENTINEL_HOST: 0.0.0.0
      HEARTH_SENTINEL_PORT: 8789
      HEARTH_GATEWAY_URL: http://gateway:8787
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
    depends_on:
      gateway:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8789/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  coturn:
    image: ${HEARTH_IMAGE_PREFIX:-}coturn/coturn:4.18.0
    profiles: ["turn"]
    restart: unless-stopped
    environment:
      HEARTH_TURN_USERNAME: ${HEARTH_TURN_USERNAME:-}
      HEARTH_TURN_PASSWORD: ${HEARTH_TURN_PASSWORD:-}
      HEARTH_ICE_PUBLIC_IP: ${HEARTH_ICE_PUBLIC_IP:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_MIN_PORT: ${TURN_MIN_PORT:-49160}
      TURN_MAX_PORT: ${TURN_MAX_PORT:-49200}
      TURN_REALM: ${TURN_REALM:-hearth}
      HEARTH_TURN_TLS: ${HEARTH_TURN_TLS:-0}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_CERT: ${TURN_CERT:-}
      TURN_PKEY: ${TURN_PKEY:-}
      HEARTH_TURN_ALLOW_PEER: ${HEARTH_TURN_ALLOW_PEER:-}
    volumes:
      - ./deploy/coturn/start.sh:/start.sh:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    ports:
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/udp"
      - "${TURN_PORT:-3478}:${TURN_PORT:-3478}/tcp"
      - "${TURN_TLS_PORT:-5349}:${TURN_TLS_PORT:-5349}/tcp"
      - "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49200}/udp"
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "-p", "${TURN_PORT:-3478}", "127.0.0.1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  caddy:
    image: ${HEARTH_IMAGE_PREFIX:-}library/caddy:2
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      HEARTH_DOMAIN: ${HEARTH_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
    restart: unless-stopped

  mailpit:
    image: ${HEARTH_IMAGE_PREFIX:-}axllent/mailpit:v1.21
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  hearth-pg:
  hearth-data:
  caddy-data:
  caddy-config:
