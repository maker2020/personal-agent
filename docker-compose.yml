# Hearth listens on the gateway. Postgres is the durable store.
# Copy .env.example to .env before `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hearth}
      POSTGRES_DB: hearth
    volumes:
      - hearth-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  hearth:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD:-hearth}@postgres:5432/hearth
      HEARTH_GATEWAY_HOST: 0.0.0.0
      HEARTH_GATEWAY_PORT: 8787
      HEARTH_ROLES: all
      HEARTH_DATA_DIR: /data
      HEARTH_WORKSPACE_ROOT: /data/workspaces
      DSH_HOME: /data/dsh
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
      - "${SIP_SIGNAL_PORT:-5060}:5060/udp"
      - "${SIP_RTP_PORT_MIN:-10000}-${SIP_RTP_PORT_MAX:-10199}:${SIP_RTP_PORT_MIN:-10000}-${SIP_RTP_PORT_MAX:-10199}/udp"
    volumes:
      - hearth-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  hearth-pg:
  hearth-data:
